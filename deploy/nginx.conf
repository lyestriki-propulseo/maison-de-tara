server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /admin  { return 301 https://admin.maisondetara.propulseo-site.com/; }
  location = /admin/ { return 301 https://admin.maisondetara.propulseo-site.com/; }

  # Pages .html et fichiers statiques. 404 personnalisée du site.
  # Old .html links are redirected permanently to their clean public URL.
  location = /index.html { return 301 /; }
  location ~ ^/(atelier|boutique|calendrier|histoire|contact|mentions-legales|politique-de-confidentialite|confirmation-reservation)\.html$ {
    return 301 /$1$is_args$args;
  }

  # Serve /atelier from atelier.html without exposing the extension.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  error_page 404 /404.html;

  # Images / polices : cache long (ne changent pas souvent)
  location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # CSS / JS : revalidation à chaque chargement (site en itération — pas de Ctrl+F5)
  location ~* \.(css|js)$ {
    add_header Cache-Control "no-cache";
  }

  # JSON de données (événements) : pas de cache
  location ~* \.json$ {
    add_header Cache-Control "no-cache";
  }
}
