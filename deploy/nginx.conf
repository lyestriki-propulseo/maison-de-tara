server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pages .html et fichiers statiques. 404 personnalisée du site.
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;

  # Cache des assets (images, css, js, polices)
  location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|css|js|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # Pas de cache sur le JSON de données (événements) pour refléter les mises à jour
  location ~* \.json$ {
    add_header Cache-Control "no-cache";
  }
}
