<!doctype html>
<html lang="fr">
<head>
<!-- include: head -->
<title>Le Calendrier · Maison de Tara</title>
<meta name="description" content="Les ateliers, événements et nouveautés de la boutique à venir à la Maison de Tara, à La Garenne-Colombes.">
<meta property="og:title" content="Le Calendrier · Maison de Tara">
<meta property="og:description" content="Les ateliers, événements et nouveautés de la boutique à venir à la Maison de Tara, à La Garenne-Colombes.">
<link rel="stylesheet" href="css/premium-calendrier.css">
</head>
<body>
<!-- include: header -->
<main id="main" class="mdt-natural-scroll premium-calendrier">

  <!-- En-tête éditorial -->
  <section class="hero">
    <div class="container">
      <span class="script" aria-hidden="true">Le calendrier</span>
      <h1>Les prochains rendez-vous</h1>
      <p class="intro">Ateliers, événements et nouveautés de la boutique&nbsp;: tout ce qui se passe à la maison. Cliquez sur une date marquée pour en savoir plus.</p>
    </div>
    <div class="arches" aria-hidden="true">
      <figure class="arch"><img src="../assets-premium-lp/atelier-action.jpg" alt="" loading="lazy"></figure>
      <figure class="arch"><img src="../assets-charte/cuisine-cafe.jpg" alt="" loading="lazy"></figure>
      <figure class="arch"><img src="../assets-premium-lp/sortie-four.jpg" alt="" loading="lazy"></figure>
    </div>
  </section>

  <!-- Programme + grille -->
  <section class="container body-grid">

    <div class="prog-col">
      <h2 class="prog-heading">Le programme de la maison</h2>
      <p class="prog-heading-note">Par ordre de date</p>
      <ol class="prog-list" id="programme" aria-label="Programme des événements"></ol>
    </div>

    <aside class="cal-col" aria-label="Calendrier mensuel">
      <div class="cal-card" id="calendar"></div>
    </aside>

  </section>

  <!-- Sortie de page douce : une ligne, pas de bande (revue expert 12/06) -->
  <div class="page-envoi">
    <p class="page-envoi__script">Une date vous fait envie&nbsp;?</p>
    <a class="page-envoi__btn" href="atelier.html#reserver">R&eacute;server un atelier</a>
  </div>

</main>
<!-- Footer hors du scope .premium-* : rendu identique à l'accueil -->
<!-- include: footer -->
<!-- include: scripts-min -->
<script src="js/header-pages.js"></script>
<script type="module" src="js/premium-calendrier.js"></script>
</body>
</html>
